<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kipo · Borrar contraseñas guardadas</title>
  <!-- Ícono vacío: sin él, el navegador pide /favicon.ico, que no existe. -->
  <link rel="icon" href="data:," />
  <!-- Herramienta SOLO LOCAL: se abre con el servidor de desarrollo; Vite compila solo
       index.html, así que esto no llega a producción. ESCRIBE en la base, pero una sola
       cosa: quita el campo `password` de `usuarios/{email}`. -->
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p { font-size: 13px; color: #94a3b8; margin: 0 0 16px; line-height: 1.5; }
    form, .fila { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    input { flex: 1 1 200px; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 14px; }
    button { padding: 10px 16px; border-radius: 8px; border: 0; font-weight: 800; font-size: 13px; cursor: pointer; background: #f97316; color: #fff; }
    button.peligro { background: #dc2626; }
    button.sec { background: #334155; }
    button:disabled { opacity: .5; cursor: default; }
    pre { white-space: pre-wrap; word-break: break-word; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 14px; font-size: 13px; line-height: 1.6; }
    #estado { font-size: 13px; color: #fbbf24; min-height: 18px; margin-bottom: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Kipo · Borrar contraseñas guardadas</h1>
    <p>Quita la copia en texto plano que quedó en la base de datos. Las cuentas no
      cambian: cada uno sigue entrando con su contraseña de siempre. Primero REVISAR,
      después BORRAR.</p>

    <form id="login" hidden>
      <input id="usuario" placeholder="usuario o correo" autocomplete="username" required />
      <input id="clave" type="password" placeholder="contraseña" autocomplete="current-password" required />
      <button type="submit">ENTRAR</button>
    </form>

    <div id="sesion" hidden>
      <div class="fila">
        <button id="revisar">REVISAR</button>
        <button id="borrar" class="peligro" disabled>BORRAR CONTRASEÑAS</button>
        <button id="copiar" class="sec" disabled>COPIAR RESULTADO</button>
        <button id="salir" class="sec">SALIR</button>
      </div>
      <p id="quien"></p>
    </div>

    <div id="estado"></div>
    <pre id="resultado" hidden></pre>
  </main>
  <script type="module" src="./borrar-contrasenas.js"></script>
</body>
</html>
